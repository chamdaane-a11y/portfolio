<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Poppins',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1326"/>
      <stop offset="1" stop-color="#0f1b3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bd2ff"/>
      <stop offset="0.55" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="660" cy="90" r="180" fill="#4f8cff" opacity="0.12"/>
  <circle cx="120" cy="430" r="150" fill="#9b6bff" opacity="0.12"/>

  <!-- crest -->
  <rect x="60" y="70" width="92" height="92" rx="22" fill="url(#acc)"/>
  <text x="106" y="134" font-size="50" text-anchor="middle">🎓</text>

  <!-- titles -->
  <text x="172" y="112" font-size="46" font-weight="800" fill="#ffffff">GCI Academy</text>
  <text x="174" y="148" font-size="21" font-weight="500" fill="#93a0bd">Apprends la Data Science en codant</text>

  <!-- fake code panel -->
  <rect x="60" y="210" width="430" height="230" rx="16" fill="#0a1120" stroke="#1e2b4a"/>
  <circle cx="84" cy="234" r="6" fill="#ff5f57"/><circle cx="104" cy="234" r="6" fill="#febc2e"/><circle cx="124" cy="234" r="6" fill="#28c840"/>
  <g font-family="'JetBrains Mono',monospace" font-size="16">
    <text x="84" y="282" fill="#7bd2ff">import <tspan fill="#e8edf7">pandas as pd</tspan></text>
    <text x="84" y="312" fill="#e8edf7">df = pd.read_csv(<tspan fill="#f5c451">"data.csv"</tspan>)</text>
    <text x="84" y="342" fill="#e8edf7">model.<tspan fill="#9bd1ff">fit</tspan>(X, y)</text>
    <text x="84" y="372" fill="#4ade80"># précision : 0.94 ✓</text>
    <text x="84" y="408" fill="#93a0bd">▶ exécuté dans le navigateur</text>
  </g>

  <!-- chart bars -->
  <g>
    <rect x="540" y="360" width="42" height="80" rx="6" fill="url(#acc)" opacity="0.85"/>
    <rect x="595" y="310" width="42" height="130" rx="6" fill="url(#acc)" opacity="0.9"/>
    <rect x="650" y="270" width="42" height="170" rx="6" fill="url(#acc)"/>
    <rect x="705" y="230" width="42" height="210" rx="6" fill="url(#acc)"/>
  </g>
  <text x="540" y="215" font-size="15" fill="#93a0bd" font-family="'JetBrains Mono',monospace">progression →</text>

  <rect x="0.5" y="0.5" width="799" height="499" rx="0" fill="none" stroke="#1e2b4a"/>
</svg>
